<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Circular Ambient Glow -->
    <radialGradient id="slRoundGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#2563EB" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1E3A8A" stop-opacity="0"/>
    </radialGradient>

    <!-- Outer Circular Rim Gradient -->
    <linearGradient id="rimGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Top Isometric Face -->
    <linearGradient id="topFaceRound" x1="20" y1="18" x2="80" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <!-- Left Face -->
    <linearGradient id="leftFaceRound" x1="15" y1="40" x2="50" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- Right Face -->
    <linearGradient id="rightFaceRound" x1="50" y1="40" x2="85" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Inner S-Ribbon Gradient -->
    <linearGradient id="ribbonSRound" x1="30" y1="20" x2="70" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <!-- Ambient Circular Glow -->
  <circle cx="50" cy="50" r="48" fill="url(#slRoundGlow)"/>

  <!-- Main Circular Disc (Round Badge) -->
  <circle cx="50" cy="50" r="46" fill="#0F172A" stroke="url(#rimGrad)" stroke-width="2.5"/>

  <!-- Concentric Precision Ring -->
  <circle cx="50" cy="50" r="41" stroke="#38BDF8" stroke-width="0.75" stroke-dasharray="3 3" opacity="0.5"/>

  <!-- Outer Isometric Layer (The Warehouse Crate / Stack Structure) -->
  <!-- Top Face -->
  <path d="M50 18 L76 31 L50 44 L24 31 Z" fill="url(#topFaceRound)"/>
  
  <!-- Left Side Face (Upper Tier) -->
  <path d="M24 31 L50 44 L50 55 L24 42 Z" fill="url(#leftFaceRound)"/>
  
  <!-- Right Side Face (Upper Tier) -->
  <path d="M50 44 L76 31 L76 42 L50 55 Z" fill="url(#rightFaceRound)"/>

  <!-- Middle Interlocking Ledger Step (The 'S' Curve Layer) -->
  <!-- Top Surface of Middle Step -->
  <path d="M50 48 L68 57 L50 66 L32 57 Z" fill="#38BDF8" opacity="0.9"/>
  <!-- Left Face of Middle Step -->
  <path d="M32 57 L50 66 L50 75 L32 66 Z" fill="url(#ribbonSRound)"/>
  <!-- Right Face of Middle Step -->
  <path d="M50 66 L68 57 L68 66 L50 75 Z" fill="#1E3A8A"/>

  <!-- Bottom Foundation / Ledger Stack -->
  <path d="M37 70 L50 76.5 L63 70 L50 63.5 Z" fill="#93C5FD"/>
  <path d="M37 70 L50 76.5 L50 82 L37 75.5 Z" fill="#2563EB"/>
  <path d="M50 76.5 L63 70 L63 75.5 L50 82 Z" fill="#0F172A"/>

  <!-- Dynamic S-Line Cutout / Precision Accent Lines -->
  <path d="M24 31 L50 44 L76 31" stroke="#BAE6FD" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M50 44 L50 55" stroke="#93C5FD" stroke-width="1.2" stroke-linecap="round"/>
</svg>
