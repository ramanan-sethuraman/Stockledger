<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Background Glow -->
    <radialGradient id="slGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1E3A8A" stop-opacity="0"/>
    </radialGradient>

    <!-- Top Isometric Face -->
    <linearGradient id="topFace" x1="20" y1="15" x2="80" y2="45" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <!-- Left Face -->
    <linearGradient id="leftFace" x1="15" y1="40" x2="50" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- Right Face -->
    <linearGradient id="rightFace" x1="50" y1="40" x2="85" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Inner S-Ribbon Gradient -->
    <linearGradient id="ribbonS" x1="30" y1="20" x2="70" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- Emerald Audit Tick -->
    <linearGradient id="auditGlow" x1="60" y1="60" x2="85" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="50" cy="50" r="46" fill="url(#slGlow)"/>

  <!-- Base Rounded Container -->
  <rect x="4" y="4" width="92" height="92" rx="22" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Outer Isometric Layer (The Warehouse Crate / Stack Structure) -->
  <!-- Top Face -->
  <path d="M50 16 L78 30 L50 44 L22 30 Z" fill="url(#topFace)"/>
  
  <!-- Left Side Face (Upper Tier) -->
  <path d="M22 30 L50 44 L50 56 L22 42 Z" fill="url(#leftFace)"/>
  
  <!-- Right Side Face (Upper Tier) -->
  <path d="M50 44 L78 30 L78 42 L50 56 Z" fill="url(#rightFace)"/>

  <!-- Middle Interlocking Ledger Step (The 'S' Curve Layer) -->
  <!-- Top Surface of Middle Step -->
  <path d="M50 48 L70 58 L50 68 L30 58 Z" fill="#38BDF8" opacity="0.9"/>
  <!-- Left Face of Middle Step -->
  <path d="M30 58 L50 68 L50 78 L30 68 Z" fill="url(#ribbonS)"/>
  <!-- Right Face of Middle Step -->
  <path d="M50 68 L70 58 L70 68 L50 78 Z" fill="#1E3A8A"/>

  <!-- Bottom Foundation / Ledger Stack -->
  <path d="M36 72 L50 79 L64 72 L50 65 Z" fill="#93C5FD"/>
  <path d="M36 72 L50 79 L50 84 L36 77 Z" fill="#2563EB"/>
  <path d="M50 79 L64 72 L64 77 L50 84 Z" fill="#0F172A"/>

  <!-- Dynamic S-Line Cutout / Precision Accent Lines -->
  <path d="M22 30 L50 44 L78 30" stroke="#BAE6FD" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M50 44 L50 56" stroke="#93C5FD" stroke-width="1.2" stroke-linecap="round"/>
  
  <!-- Embedded Audit Precision Node -->
  <circle cx="78" cy="30" r="2.5" fill="#38BDF8"/>
  <circle cx="22" cy="30" r="2.5" fill="#38BDF8"/>
  <circle cx="50" cy="16" r="2.5" fill="#67E8F9"/>
</svg>
