<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 100" fill="none">
  <defs>
    <!-- Background Glow -->
    <radialGradient id="slFullGlowRound" cx="50" cy="50" r="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#2563EB" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1E3A8A" stop-opacity="0"/>
    </radialGradient>

    <!-- Outer Circular Rim Gradient -->
    <linearGradient id="rimGradFull" x1="10" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Top Isometric Face -->
    <linearGradient id="topFaceFullRound" x1="20" y1="15" x2="80" y2="45" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <!-- Left Face -->
    <linearGradient id="leftFaceFullRound" x1="15" y1="40" x2="50" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- Right Face -->
    <linearGradient id="rightFaceFullRound" x1="50" y1="40" x2="85" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Ledger Accent Gradient -->
    <linearGradient id="ledgerTextGradRound" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
  </defs>

  <!-- Ambient Glow for Mark -->
  <circle cx="50" cy="50" r="46" fill="url(#slFullGlowRound)"/>

  <!-- Mark Base Circular Container (Perfect Round Emblem) -->
  <circle cx="50" cy="50" r="40" fill="#0F172A" stroke="url(#rimGradFull)" stroke-width="2.5"/>
  <circle cx="50" cy="50" r="35" stroke="#38BDF8" stroke-width="0.75" stroke-dasharray="2.5 2.5" opacity="0.5"/>

  <!-- Isometric Stock Ledger Emblem -->
  <!-- Upper Tier (Crate / Stock) -->
  <path d="M50 22 L72 33 L50 44 L28 33 Z" fill="url(#topFaceFullRound)"/>
  <path d="M28 33 L50 44 L50 53 L28 42 Z" fill="url(#leftFaceFullRound)"/>
  <path d="M50 44 L72 33 L72 42 L50 53 Z" fill="url(#rightFaceFullRound)"/>

  <!-- Middle Tier (Double-Entry S-Ribbon) -->
  <path d="M50 47 L66 55 L50 64 L34 55 Z" fill="#38BDF8" opacity="0.9"/>
  <path d="M34 55 L50 64 L50 71 L34 62 Z" fill="#2563EB"/>
  <path d="M50 64 L66 55 L66 62 L50 71 Z" fill="#1E3A8A"/>

  <!-- Bottom Tier (Foundation Balance) -->
  <path d="M39 68 L50 73.5 L61 68 L50 62.5 Z" fill="#93C5FD"/>
  <path d="M39 68 L50 73.5 L50 77 L39 71.5 Z" fill="#1D4ED8"/>
  <path d="M50 73.5 L61 68 L61 71.5 L50 77 Z" fill="#0F172A"/>

  <!-- Geometric highlights -->
  <path d="M28 33 L50 44 L72 33" stroke="#BAE6FD" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Brand Wordmark Typography -->
  <g id="brand-typography">
    <!-- "STOCK" (Solid, Institutional White/Slate) -->
    <text x="110" y="58" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" letter-spacing="1" fill="#FFFFFF">STOCK</text>

    <!-- "LEDGER" (Vivid Cyan/Blue Accent) -->
    <text x="248" y="58" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" letter-spacing="1" fill="url(#ledgerTextGradRound)">LEDGER</text>

    <!-- Tagline: "EVERY STOCK. EVERY TRANSACTION. EVERY DETAIL." -->
    <text x="112" y="78" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="700" font-size="9" letter-spacing="2.8" fill="#94A3B8">
      EVERY STOCK <tspan fill="#38BDF8">·</tspan> EVERY TRANSACTION <tspan fill="#38BDF8">·</tspan> EVERY DETAIL
    </text>

    <!-- Enterprise Badge -->
    <rect x="400" y="40" width="46" height="18" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="423" y="52.5" font-family="'Inter', system-ui, sans-serif" font-weight="800" font-size="8" fill="#38BDF8" text-anchor="middle" letter-spacing="1">ERP</text>
  </g>
</svg>
