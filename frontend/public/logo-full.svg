<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 100" fill="none">
  <defs>
    <!-- Background Glow -->
    <radialGradient id="slFullGlow" cx="50" cy="50" r="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1E3A8A" stop-opacity="0"/>
    </radialGradient>

    <!-- Top Isometric Face -->
    <linearGradient id="topFaceFull" x1="20" y1="15" x2="80" y2="45" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <!-- Left Face -->
    <linearGradient id="leftFaceFull" x1="15" y1="40" x2="50" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- Right Face -->
    <linearGradient id="rightFaceFull" x1="50" y1="40" x2="85" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Ledger Accent Gradient -->
    <linearGradient id="ledgerTextGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
  </defs>

  <!-- Ambient Glow for Mark -->
  <circle cx="50" cy="50" r="44" fill="url(#slFullGlow)"/>

  <!-- Mark Base Container -->
  <rect x="10" y="10" width="80" height="80" rx="20" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Isometric Stock Ledger Emblem -->
  <!-- Upper Tier (Crate / Stock) -->
  <path d="M50 20 L74 32 L50 44 L26 32 Z" fill="url(#topFaceFull)"/>
  <path d="M26 32 L50 44 L50 54 L26 42 Z" fill="url(#leftFaceFull)"/>
  <path d="M50 44 L74 32 L74 42 L50 54 Z" fill="url(#rightFaceFull)"/>

  <!-- Middle Tier (Double-Entry S-Ribbon) -->
  <path d="M50 48 L68 57 L50 66 L32 57 Z" fill="#38BDF8" opacity="0.9"/>
  <path d="M32 57 L50 66 L50 74 L32 65 Z" fill="#2563EB"/>
  <path d="M50 66 L68 57 L68 65 L50 74 Z" fill="#1E3A8A"/>

  <!-- Bottom Tier (Foundation Balance) -->
  <path d="M38 70 L50 76 L62 70 L50 64 Z" fill="#93C5FD"/>
  <path d="M38 70 L50 76 L50 80 L38 74 Z" fill="#1D4ED8"/>
  <path d="M50 76 L62 70 L62 74 L50 80 Z" fill="#0F172A"/>

  <!-- Geometric highlights -->
  <path d="M26 32 L50 44 L74 32" stroke="#BAE6FD" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="50" cy="20" r="2" fill="#67E8F9"/>

  <!-- Brand Wordmark Typography -->
  <g id="brand-typography">
    <!-- "STOCK" (Solid, Institutional White/Slate) -->
    <text x="110" y="58" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" letter-spacing="1" fill="#FFFFFF">STOCK</text>

    <!-- "LEDGER" (Vivid Cyan/Blue Accent) -->
    <text x="248" y="58" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" letter-spacing="1" fill="url(#ledgerTextGrad)">LEDGER</text>

    <!-- Tagline: "EVERY STOCK. EVERY TRANSACTION. EVERY DETAIL." -->
    <text x="112" y="78" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="700" font-size="9" letter-spacing="2.8" fill="#94A3B8">
      EVERY STOCK <tspan fill="#38BDF8">·</tspan> EVERY TRANSACTION <tspan fill="#38BDF8">·</tspan> EVERY DETAIL
    </text>

    <!-- Subtle Enterprise Badge -->
    <rect x="400" y="40" width="46" height="18" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="423" y="52.5" font-family="'Inter', system-ui, sans-serif" font-weight="800" font-size="8" fill="#38BDF8" text-anchor="middle" letter-spacing="1">ERP</text>
  </g>
</svg>
